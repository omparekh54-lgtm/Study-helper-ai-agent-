# Render Blueprint for the StudyForge API (free Docker web service).
services:
  - type: web
    name: studyforge-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # Postgres URL (Neon / Supabase / Render)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false # optional
      - key: FRONTEND_ORIGINS
        sync: false # e.g. https://studyforge.vercel.app
      - key: ENVIRONMENT
        value: production
